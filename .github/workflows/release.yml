name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to build (e.g. v1.0.0)
        required: true

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  android:
    name: Android (signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The keystore is stored as base64 in ANDROID_KEYSTORE_BASE64:
      #   base64 -w0 upload-keystore.jks
      # Never commit the .jks or key.properties. Losing this keystore means
      # you can never update the app on Play again.
      - name: Restore signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=${{ github.workspace }}/android/upload-keystore.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - run: flutter pub get

      # AAB for Play, APK for direct install and side-loaded testing.
      #
      # --target-platform governs the native bridge too: both Gradle modules
      # read Flutter's own -Ptarget-platform, so the emulator's x86_64 slice
      # is dropped here without a second flag that could drift out of step.
      - name: Build app bundle
        run: flutter build appbundle --release --target-platform android-arm64
        timeout-minutes: 45

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64
        timeout-minutes: 45

      - name: Shred signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (signed)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: arm64
          cache: true

      # Certificate + provisioning profile live in a temporary keychain that
      # is destroyed at the end of the job.
      - name: Install signing certificate
        env:
          CERT_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db

          echo "$CERT_P12" | base64 -d > "$CERT_PATH"
          echo "$PROFILE" | base64 -d > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build llama.cpp xcframework
        run: packages/llama_bridge/tool/build_apple_frameworks.sh
        timeout-minutes: 45

      - run: flutter pub get

      - name: Build IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/ipa/*.ipa

  desktop:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            artifact: build/windows/x64/runner/Release
          - os: macos-14
            target: macos
            artifact: build/macos/Build/Products/Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build llama.cpp xcframework
        if: matrix.target == 'macos'
        run: packages/llama_bridge/tool/build_apple_frameworks.sh
        timeout-minutes: 45

      - run: flutter pub get

      - name: Build
        run: flutter build ${{ matrix.target }} --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-release
          path: ${{ matrix.artifact }}

  publish:
    name: Draft GitHub release
    needs: [android, ios, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Drafted, not published. A release is outward-facing; a human should
      # look at it before it goes live.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
