name: Build APK

# Manual only. This is the "give me something to sideload" workflow: one
# job, no macOS runners, no secrets. The full CI matrix in ci.yml is for
# verifying changes; this is for getting an installable file.
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build mode
        type: choice
        default: release
        options: [release, debug]
      abi:
        description: Target ABI
        type: choice
        default: android-arm64
        options: [android-arm64, android-x64]
      fake_engine:
        description: >-
          Use the simulated engine (works with no backend and no model file)
        type: boolean
        default: false

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  apk:
    name: ${{ inputs.build_mode }} / ${{ inputs.abi }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # llama.cpp is compiled from source by the NDK and dominates the build
      # time. Cached against the submodule SHA plus the bridge sources, so a
      # Dart-only change reuses the objects instead of paying ~20 minutes.
      - name: Resolve llama.cpp revision
        id: llama
        run: echo "sha=$(git -C third_party/llama.cpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: packages/llama_bridge/android/.cxx
          key: cxx-${{ inputs.abi }}-${{ steps.llama.outputs.sha }}-${{ hashFiles('packages/llama_bridge/src/*') }}
          restore-keys: cxx-${{ inputs.abi }}-${{ steps.llama.outputs.sha }}-

      - run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk \
            --${{ inputs.build_mode }} \
            --target-platform ${{ inputs.abi }} \
            ${{ inputs.fake_engine && '--dart-define=USE_FAKE_ENGINE=true' || '' }}

      # Renamed so a downloaded artifact is self-describing; several of
      # these end up in a downloads folder called app-release.apk otherwise.
      - name: Stage artifact
        id: stage
        run: |
          set -euo pipefail
          src=$(find build/app/outputs/flutter-apk -name '*.apk' ! -name '*.sha1' | head -1)
          short=$(git rev-parse --short HEAD)
          name="enlibra-${{ inputs.build_mode }}-${{ inputs.abi }}-${short}.apk"
          mkdir -p dist && cp "$src" "dist/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "dist/$name"

      - name: Report contents
        run: |
          echo "### APK built" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "| file | size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          size=$(du -h "dist/${{ steps.stage.outputs.name }}" | cut -f1)
          echo "| ${{ steps.stage.outputs.name }} | $size |" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native libraries:' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          unzip -l "dist/${{ steps.stage.outputs.name }}" | grep '\.so$' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '> Debug-signed. Installable by sideloading; not uploadable to Play.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error
